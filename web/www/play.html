<!doctype html>
<html lang="en" data-page="play">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terraria</title>
  <style>
    /* Only the game: the canvas fills the window. Before the game's first frame a thin bar without text; it goes at
       that frame. The document title follows the game window's own title. (main.js, PLAY mode) */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #stage { position: fixed; inset: 0; background: #000; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; border: 0; }
    #ime { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
      resize: none; overflow: hidden; pointer-events: none; }
    #loading { position: absolute; left: 50%; bottom: 12%; width: min(320px, 50vw); height: 4px; transform: translateX(-50%);
      background: #222; border-radius: 2px; overflow: hidden; pointer-events: none; }
    #loading-bar { height: 100%; width: 0; background: #777; transition: width .2s linear; }
    #loading.busy #loading-bar { width: 30%; animation: slide 1.2s ease-in-out infinite alternate; }
    @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
    .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
      color: #ddd; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="stage">
    <!-- the canvas is created by main.js (a canvas can be handed to a Worker only once) -->
    <textarea id="ime" aria-hidden="true" tabindex="-1" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div id="loading" class="busy" aria-hidden="true"><div id="loading-bar"></div></div>
    <!-- only when this browser cannot run the game at all -->
    <div class="screen" id="screen-unsupported" hidden>
      <div><p id="unsupported-text">This browser can't run it. It needs Chrome or Edge 137+ with WebGPU.</p><p id="unsupported-detail"></p></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
