[package]
name = "terraria-shaders"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Direct3D 9 shader bytecode (the ps_2_0 / vs_2_0 programs inside the game's compiled XNA effects) -> WGSL: decoder, disassembler, D3DX preshader, translator and a CPU reference interpreter (no Bevy, no dependencies)"

[dependencies]

[dev-dependencies]
# the effect container parser and the XNB reader, to get at the game's real shaders in tests and in the generator
terraria-host = { path = "../terraria-host" }
terraria-formats = { workspace = true }
# the versions Bevy 0.19.1 already brings in (Cargo.lock): naga to validate the generated WGSL, wgpu for the
# interpreter-versus-GPU comparison on a headless device
naga = { version = "29.0.3", features = ["wgsl-in"] }
wgpu = { version = "29.0.3", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan", "naga-ir"] }
bytemuck = "1"
